name: Publish release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, e.g. 0.1.0 or 0.1.0-beta.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Validate version and immutable tag
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_VERSION } else { $env:GITHUB_REF_NAME.Substring(1) }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') { throw 'Invalid release version.' }
          $tag = "v$version"
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) {
            $existing = git rev-list -n 1 $tag
            if ($LASTEXITCODE -ne 0 -or $existing -ne $env:GITHUB_SHA) { throw 'Existing tag points to a different commit. Use a new version.' }
          } elseif ($LASTEXITCODE -ne 1) { throw 'Unable to inspect tag.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Build, check and package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Build.ps1 -Version $env:RELEASE_VERSION
      - name: Native Windows and IIS checks
        shell: pwsh
        run: ./scripts/Test-Windows.ps1
      - name: Preserve build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = @'
          IIS 证书管家，自动管理 Windows IIS 网站的 HTTPS 证书。

          - 自动读取 IIS 网站、域名绑定和 SSL 证书。
          - 支持 HTTP-01 和阿里云 DNS-01 自动签发；未配置 DNS 时默认使用 HTTP-01。
          - 自动部署证书并配置 HTTPS 绑定。
          - 支持证书自动续期，默认到期前 30 天续签，可调整为 7–60 天。
          - 中文管理界面，支持查看证书状态、管理续期规则和操作日志。
          - 后台持续运行，关闭界面后仍可自动续期。

          下载 `IisCertManager-Setup-win-x64.exe`，双击运行并点击“安装 / 更新”即可。
          '@
          $notes | Set-Content -Encoding utf8 artifacts/release-notes.md
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; published releases are not overwritten. Use a new version.' }
          $releaseArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA, '--title', "IIS 证书管家 $env:RELEASE_TAG", '--notes-file', 'artifacts/release-notes.md')
          if ($env:IS_PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
          $releaseArgs += @('artifacts/IisCertManager-Setup-win-x64.exe', 'artifacts/IisCertManager-win-x64.zip', 'artifacts/IisCertManager-source.zip', 'artifacts/SHA256SUMS.txt')
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publishing failed.' }
